<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Confirmação Necessária</title>
    <link rel="shortcut icon" href="/static/icon.ico" type="image/x-icon">
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 5em; background-color: #e6f7ff; color: #004085; }
        .container { max-width: 600px; margin: auto; border: 1px solid #b8daff; padding: 2em; border-radius: 8px; background-color: white;}
        .cta-button { 
            display: inline-block;
            background-color: #007bff; 
            color: white; 
            border: none; 
            cursor: pointer; 
            font-size: 1.1em; 
            padding: 0.8em 1.5em; 
            border-radius: 5px; 
            margin-top: 1.5em;
            text-decoration: none;
        }
        .cta-button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📧 Verificação de E-mail Necessária</h1>
        <p>A Shopee enviou um link de verificação para o seu e-mail. Por favor, acesse seu e-mail e clique no link para autorizar este novo login.</p>
        <p><strong>Após a confirmação, você precisará iniciar a pesquisa novamente.</strong></p>
        
        <a href="/" class="cta-button">Voltar ao Menu Principal</a>
    </div>
</body>
</html>
